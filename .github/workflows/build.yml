name: Build, Analyze and Deploy

on:
  push:
    branches:
      - feature/issue-2-company-dtos
      - Dev # Te sugiero incluir Dev para que los intentos se vean al integrar

jobs:
  build-and-deploy:
    name: Quality and Delivery Pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 1. ANÁLISIS DE CALIDAD
      - name: Build and analyze with Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=optimizapp \
          -Dsonar.projectName='optimizapp'

      # 2. NORMALIZACIÓN Y LOGIN (Corrección del error de minúsculas)
      - name: Log in to GitHub Container Registry
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and Push Docker Image
        if: success()
        run: |
          # Convertimos el nombre de usuario a minúsculas para cumplir con el estándar de Docker
          IMAGE_ID=$(echo "ghcr.io/${{ secrets.CR_USER }}/optimizapp-backend" | tr '[:upper:]' '[:lower:]')
          
          echo "Construyendo imagen: $IMAGE_ID:latest"
          
          docker build -t $IMAGE_ID:latest .
          docker push $IMAGE_ID:latest

      # 3. DESPLIEGUE A KUBERNETES 
      - name: Set Kubernetes Context
        if: success()
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Kubernetes
        if: success()
        uses: azure/k8s-deploy@v4
        with:
          # Si aún no tienes el secreto K8S_NAMESPACE, puedes poner el nombre fijo aquí temporalmente
          namespace: ${{ secrets.K8S_NAMESPACE }} 
          manifests: |
            k8s/deployment.yaml
          images: |
            ghcr.io/diegofernzab/optimizapp-backend:latest