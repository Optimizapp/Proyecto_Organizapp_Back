name: Build, Analyze and Dockerize

on:
  push:
    branches:
      - Dev
      - 'feature/**' # Recomendado para ver intentos en ramas de trabajo

jobs:
  pipeline:
    name: Quality and Delivery Pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para un análisis de SonarQube preciso

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Análisis de Calidad (SonarQube)
      # Un evaluador senior busca que no despliegues código con bugs conocidos
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=optimizapp \
          -Dsonar.projectName='optimizapp'

      # 2. Autenticación en GitHub Container Registry
      - name: Log in to GHCR
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      # 3. Construcción y Publicación de Imagen
      # Aquí corregimos el error de "lowercase" dinámicamente
      - name: Build and Push Docker Image
        if: success()
        run: |
          # Normalizamos el nombre del repo a minúsculas
          LOWER_USER=$(echo "${{ secrets.CR_USER }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$LOWER_USER/optimizapp-backend"
          
          echo "Construyendo imagen: $IMAGE_NAME:latest"
          
          docker build -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:latest