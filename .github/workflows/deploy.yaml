name: Build and Deploy with MicroK8s

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-publish:
    name: Build and Push Image to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Mostrar rama actual
      run: "echo 'Rama actual: ${{ github.ref }}'"

    - name: Checkout code 
      uses: actions/checkout@v5

    - name: Set OWNER_LC
      run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: docker build -t ghcr.io/${OWNER_LC}/proyecto_organizapp_back:latest .

    - name: Push Docker image
      run: docker push ghcr.io/${OWNER_LC}/proyecto_organizapp_back:latest


    - name: Print pushed image URL
      run: 'echo "Imagen publicada: ghcr.io/${OWNER_LC}/proyecto_organizapp_back:latest"'

  deploy-onpremise:
    name: Deploy on MicroK8s On-Premise
    runs-on: main
    needs: build-and-publish

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5
    - name: Check MicroK8s status
      run: sudo microk8s status --wait-ready

    - name: Check cluster connectivity
      run: sudo microk8s kubectl get nodes

    - name: Ensure namespace exists
      run: sudo microk8s kubectl create namespace grupo14 --dry-run=client -o yaml | sudo microk8s kubectl apply -f -

    - name: Apply Kubernetes deployment
      run: sudo microk8s kubectl apply -f k8s/deployment.yaml

    - name: Restart Kubernetes deployment
      run: sudo microk8s kubectl rollout restart deployment/organizapp-backend -n grupo14

    - name: Wait for rollout
      run: sudo microk8s kubectl rollout status deployment/organizapp-backend -n grupo14 --timeout=180s

    - name: Show deployed resources
      if: always()
      run: sudo microk8s kubectl get all -n grupo14

    - name: Describe pods
      if: always()
      run: sudo microk8s kubectl describe pods -n grupo14

    - name: Show current pod logs
      if: always()
      run: |
        for pod in $(sudo microk8s kubectl get pods -n grupo14 -l app=organizapp-backend -o jsonpath='{.items[*].metadata.name}'); do
          echo "===== Current logs for $pod ====="
          sudo microk8s kubectl logs "$pod" -n grupo14 --tail=100 || true
        done

    - name: Show previous pod logs
      if: always()
      run: |
        for pod in $(sudo microk8s kubectl get pods -n grupo14 -l app=organizapp-backend -o jsonpath='{.items[*].metadata.name}'); do
          echo "===== Previous logs for $pod ====="
          sudo microk8s kubectl logs "$pod" -n grupo14 --previous --tail=100 || true
        done
