---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  namespace: grupo14
data:
  DB_URL: jdbc:postgresql://190.146.2.119:2345/grupo14
  CORS_ALLOWED_ORIGINS: "http://localhost:4200,https://grupo14.inphotech.co"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: organizapp-backend
  namespace: grupo14
spec:
  replicas: 2
  selector:
    matchLabels:
      app: organizapp-backend
  template:
    metadata:
      labels:
        app: organizapp-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: organizapp-backend
        image: ghcr.io/optimizapp/proyecto_organizapp_back:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: backend
              key: DB_URL
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: backend
              key: CORS_ALLOWED_ORIGINS
---
apiVersion: v1
kind: Service
metadata:
  name: organizapp-backend
  namespace: grupo14
spec:
  selector:
    app: organizapp-backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
