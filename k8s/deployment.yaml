---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  namespace: grupo14
data:
  DB_URL: jdbc:postgresql://190.146.2.119:2345/grupo14
  cors-allowed-origins: "https://grupo14.inphotech.co,http://localhost:4200"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: organizapp-backend
  namespace: grupo14
spec:
  replicas: 1
  selector:
    matchLabels:
      app: organizapp-backend
  template:
    metadata:
      labels:
        app: organizapp-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: organizapp-backend
        image: ghcr.io/optimizapp/proyecto_organizapp_back:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: backend
              key: DB_URL
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: organizapp-secrets
              key: jwt-secret
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: backend
              key: cors-allowed-origins
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: organizapp-backend
  namespace: grupo14
spec:
  selector:
    app: organizapp-backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: organizapp-backend
  namespace: grupo14
spec:
  ingressClassName: public
  rules:
  - host: grupo14.inphotech.co
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: organizapp-backend
            port:
              number: 8080
