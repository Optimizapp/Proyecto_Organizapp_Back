# Evaluación: Arquitectura de Despliegue Robusta
apiVersion: apps/v1
kind: Deployment
metadata:
  name: organizapp-backend
  namespace: grupo14 # Confirmado según tu monitor
  labels:
    app: organizapp-backend
    component: api
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: organizapp-backend
  template:
    metadata:
      labels:
        app: organizapp-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret 
      containers:
        - name: organizapp-backend
          # CRÍTICO: Asegúrate que este sea el nombre exacto que arroja tu GitHub Action
          image: ghcr.io/diegofernzab/optimizapp-backend:latest 
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/organizapp_db?useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            # MEJORA DE SEGURIDAD: Uso de Secrets para credenciales
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40 # Aumentado para dar tiempo a que cargue el contexto de Spring
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: organizapp-backend
  namespace: grupo14
spec:
  type: ClusterIP
  selector:
    app: organizapp-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: organizapp-backend
  namespace: grupo14
  annotations:
    kubernetes.io/ingress.class: "public"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: grupo14.inphotech.co # Ajustado a tu subdominio de grupo
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: organizapp-backend
                port:
                  name: http