# Template for the organizapp-db-secret Kubernetes Secret.
# Replace the placeholder values with the actual base64-encoded credentials before applying.
#
# To encode a value:  echo -n 'value' | base64
#
# Apply with:  kubectl apply -f k8s/secret.yaml -n grupo14
#
# DO NOT commit this file with real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: organizapp-db-secret
  namespace: grupo14
type: Opaque
data:
  # base64-encoded value of: jdbc:postgresql://<host>:<port>/<database>
  url: BASE64_ENCODED_DB_URL
  # base64-encoded database username
  username: BASE64_ENCODED_DB_USER
  # base64-encoded database password
  password: BASE64_ENCODED_DB_PASSWORD
