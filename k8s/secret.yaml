# Agrega la clave jwt-secret al Secret existente "backend-secret".
# IMPORTANTE: Reemplazar el valor antes de aplicar en producción.
# Generar una clave segura con: openssl rand -base64 64
# Codificar en base64 con: echo -n "tu-clave-secreta" | base64
#
# Aplicar con: kubectl apply -f secret.yaml -n grupo14
# El valor de ejemplo abajo es SOLO para referencia y NO debe usarse en producción.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: grupo14
type: Opaque
data:
